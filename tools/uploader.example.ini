; Пример настроек загрузчика. Скопируйте в uploader.ini и замените значения.
; Ключ API не пишите сюда — сохраните его в отдельный файл (token_file)
; или в переменную окружения ART_IMPORT_TOKEN.

[mirame]
url = https://mirame.ru
token_file = ~/.config/art-uploader/mirame.token
purpose = photo

[mirame.folders]
; папка на компьютере = ID рубрики на сайте (узнать: --categories)
~/Картины/МираМе/Море = 12
~/Картины/МираМе/Абстракция = 7

[holstory]
url = https://holstory.ru
token_file = ~/.config/art-uploader/holstory.token

[holstory.folders]
~/Картины/ХолСтори/Пейзажи = 3
